# =============================================================================
# Railway deployment configuration
# =============================================================================
# Railway reads this file automatically. It pins the Dockerfile build so the
# result is identical to a local `docker build`, instead of relying on Nixpacks
# auto-detection.
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /api/health antwortet ohne Datenbankzugriff — es gibt keine Datenbank mehr.
# Ein Aussetzer bei einem Fremddienst kann also keine Neustartschleife auslösen.
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
